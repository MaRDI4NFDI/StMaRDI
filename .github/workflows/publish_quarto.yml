name: Publish Quarto Book

on:
  push:
    branches:
      - main

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    env:
      QUARTO_PUB_AUTH_TOKEN: ${{ secrets.QUARTO_AUTH_TOKEN }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.5.57'

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.2'

      - name: Install system dependencies 
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgsl-dev \
            libgraphviz-dev \
            librdf0-dev \
            libraptor2-dev \
            libcurl4-openssl-dev \
            libxml2-dev \
            libssl-dev \
            libsecret-1-dev \
            libglib2.0-dev \
            libjpeg-dev \
            libpng-dev

      - name: Restore R environment
        run: Rscript -e 'install.packages("renv"); renv::restore()'

      - name: Render the book
        run: quarto render

      - name: Publish to Quarto Pub
        run: quarto publish quarto-pub
